# ==============================================================================
# .tmux.conf - Tmux 設定
# ==============================================================================

# ------------------------------------------------------------------------------
# 基本設定・プレフィックスキー
# ------------------------------------------------------------------------------
# プレフィックスキーを Ctrl-a に変更 (デフォルトの Ctrl-b を解除)
set -g prefix C-a
unbind C-b

# Escキーの入力遅延をなくす
set -s escape-time 0

# 256色表示を有効化する
set-option -g default-terminal "screen-256color"

# macOS で reattach-to-user-namespace が存在する場合のみクリップボード共有ラッパーを使用
if-shell "command -v reattach-to-user-namespace >/dev/null 2>&1" \
    'set-option -g default-command "reattach-to-user-namespace -l zsh"'

# ------------------------------------------------------------------------------
# キーバインド (ウィンドウ・ペイン操作)
# ------------------------------------------------------------------------------
# Prefix + r で設定ファイルを再読み込み
bind-key r source-file ~/.tmux.conf \; display "Configuration reloaded"

# Prefix + Ctrl-h / Ctrl-l でウィンドウ切り替え (連続入力可能)
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

# Prefix + h/j/k/l でペイン移動
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Prefix + H/J/K/L でペインサイズ調整 (連続入力可能)
bind-key -r H resize-pane -L 1
bind-key -r J resize-pane -D 1
bind-key -r K resize-pane -U 1
bind-key -r L resize-pane -R 1

# ------------------------------------------------------------------------------
# コピーモード・マウス操作
# ------------------------------------------------------------------------------
# Prefix + v でコピーモード開始、Prefix + p でペースト
bind-key v copy-mode \; display "Copy mode!"
bind-key p paste-buffer

# マウスモード設定とホイールスクロール挙動
set -g mouse off
bind-key -T root WheelUpPane   if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; copy-mode -e; send-keys -M"
bind-key -T root WheelDownPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; send-keys -M"

# ------------------------------------------------------------------------------
# ステータスバー・外観デザイン (Molokai テーマベース)
# ------------------------------------------------------------------------------
set-option -g status-position top
set-option -g status-interval 1
set-option -g status-justify centre
set-option -g status-left-length 90
set-option -g status-right-length 90

# 左右ステータス表示 (外部スクリプトに依存しない内蔵フォーマットを使用)
set-option -g status-left 'tmux:[#P] #{pane_id}'
set-option -g status-right '[%Y-%m-%d(%a) %H:%M:%S]'

# カラー設定
set-option -g status-bg colour234
set-option -g status-fg colour252
set-window-option -g window-status-style fg=colour252,bg=default,dim
set-window-option -g window-status-current-style fg=colour135,bg=default,bright
set-option -g pane-border-style fg=colour234
set-option -g pane-active-border-style fg=colour234
set-option -g message-style bg=colour234,fg=colour252

# ------------------------------------------------------------------------------
# マシン固有設定の読み込み (Git管理外)
# ------------------------------------------------------------------------------
if-shell "[ -f ~/.tmux.conf.local ]" "source-file ~/.tmux.conf.local"
